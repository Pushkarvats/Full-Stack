<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
     rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous">
</head>
<body>

    <div class="container">Course Search and Subscription </div>
    <div class="input-group">
        <input type="text" name="search" id="search" class="form-control" placeholder="Search for a course" title="click to search ">
        <button class="btn btn-primary">Search</button>
    </div>
    <div class="input-group">
        <input type="text" name="search" id="search" class="form-control" placeholder="Enter your email">
        <button class="btn btn-success">Subscribe</button>
    </div>
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Change Password</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
         <div class="input-group">
            <label class="tooltip">New Password</label>
        <input type="text" name="search" id="search" class="form-control">
         </div>
        <div class="input-group">
            <label class="tooltip">Confirm New Password</label>
        <input type="text" name="search" id="search" class="form-control" >
        </div>
      </div>
      <br>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Close</button>
        <button type="button" class="btn btn-success">Submit</button>
      </div>
    </div>
  </div>
</div>

     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
     integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
     crossorigin="anonymous"></script>
    
    
</body>
</html>
