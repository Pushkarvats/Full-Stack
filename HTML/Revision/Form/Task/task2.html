<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3 align="center">Task 2:</h3>
    <p>
      <u
        >Create an HTML form as shown in given Image. Use only pure HTML
        codes.</u
      >
    </p>

    <fieldset>
      <h2>Pizza Order Form</h2>
      <div>
        <label for="firstName">First Name: </label>
        <input type="text" name="firstName" id="firstName" />
      </div> <br>
      <div>
        <label for="lastName">Last Name: </label>
        <input type="text" name="lastName" id="lastName" />
      </div> <br>
      <div>
        <label for="email">Email Address: </label>
        <input type="email" name="email" id="email" />
      </div> <br>
      <div>
        <label for="contactNo">Contact Number: </label>
        <input type="number" name="contactNo" id="contactNo" />
      </div>  <br>
      <div>
        <label for="date">Preferred Delivery Date: </label>
        <input type="date" name="date" id="date" />
      </div> <br>
      <div>
        <label for="size">Size:</label>
        <br />
        <input type="radio" name="size" id="size" /><span>Small</span>
        <input type="radio" name="size" id="size" /><span>Medium</span>
        <input type="radio" name="size" id="size" /><span>Large</span>
      </div> <br>
      <div>
        <label for="flavor">Flavor:</label>
        <br />

        <input type="checkbox" name="flavor" id="flavor" value="1" /><span
          >Hawaiian(Php 150.00)</span>
          <select ><option value="1">1</option></select>
        <br />
        <input type="checkbox" name="flavor" id="flavor" value="" /><span
          >Pepperoni(Php 140.00)</span >
          <select ><option value="1">1</option></select><br />
        <input type="checkbox" name="flavor" id="flavor" value="1" /><span
          >Vegetable(Php 130.00)</span>
          <select ><option value="1">1</option></select><br />
      </div> <br>

      <div>
        <label for="creditcard">Credit Card Number: </label>
        <input type="number" name="creditcard" id="creditcard" />
      </div> <br>
      <div>
        <label for="pin">PIN: </label>
        <input type="number" name="pin" id="pin" />
      </div>  <br>
      <div>
        <label for="note">Additional Note: </label> <br>
        <textarea name="note" id="note"></textarea>
      </div> <br>
      <button>Submit Order</button>
    </fieldset>

    <hr>
    <a href="../form.html"><button>Back</button></a>
</body>
</html>
