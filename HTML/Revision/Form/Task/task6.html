<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     <h3 align="center">Task 6:</h3>
    <p>
      <u
        >Create an HTML form as shown in given Image. Use only pure HTML
        codes.</u
      >
    </p>
    <fieldset>
        <div>
            <a href=""></a>

        </div>
        <div align="center">
            <h2>Doctor Appointment Form</h2>
            <hr>
            <label for="">Appointment Date</label>
            <input type="date"><br><br>
            <label for="">Appointment Time</label>
            <input type="time"> <br><br>
            <label for="">Name</label>
            <input type="text" placeholder="First">
            <input type="text" placeholder="Last"> <br><br>
            <label for="">Gender</label>
            <span>Male</span><input type="radio" name="gender" id="">
            <span>Female</span><input type="radio" name="gender" id=""> <br><br>
            <label for="">Phone</label>
            <input type="number" placeholder="####"> <br><br>
            <label for="">Address</label>
            <input type=" text" placeholder="city">
            <input type="text" placeholder="state"> <br><br>
            <label for="">Your Query</label>
            <textarea name="notes" id="notes"></textarea> <br><br>
            <label for="">Appointment Type</label><span></span>
            <div  align="center">
                <p>Select which appointment type(s) you require</p>
                <input type="checkbox"><span>Cervix checkup</span> <br>
                <input type="checkbox"><span>Heart checkup</span><br>
                <input type="checkbox"><span>Eye checkup</span><br>
                <input type="checkbox"><span>Hearing Test</span><br>
                <button>Send</button>
            </div>


        </div>
    </fieldset>
    
</body>
</html>
